[platformio]
default_envs = deep

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags = -DTP3_RTC_COUNTER=0

[env:normal]
build_flags = ${env.build_flags} -DTP3_MODE=0

[env:light]
build_flags = ${env.build_flags} -DTP3_MODE=1

[env:deep]
build_flags = ${env.build_flags} -DTP3_MODE=2

[env:deep_rtc]
build_flags = -DTP3_RTC_COUNTER=1 -DTP3_MODE=2

[env:button]
build_src_filter = +<button.cpp>
build_flags = -DTP3_BUTTON_SLEEP=0

[env:button_light]
build_src_filter = +<button.cpp>
build_flags = -DTP3_BUTTON_SLEEP=1

[env:ldr]
build_src_filter = +<ldr.cpp>
build_flags = -DTP3_LDR_SLEEP=0

[env:ldr_deep]
build_src_filter = +<ldr.cpp>
build_flags = -DTP3_LDR_SLEEP=1 -DTP3_LDR_SLEEP_US=100000ULL

[env:ldr_deep_slow]
build_src_filter = +<ldr.cpp>
build_flags = -DTP3_LDR_SLEEP=1 -DTP3_LDR_SLEEP_US=500000ULL
