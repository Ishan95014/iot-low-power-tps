[platformio]
default_envs = normal

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

[env:normal]
build_flags = -DTP3_MODE=0

[env:light]
build_flags = -DTP3_MODE=1

[env:deep]
build_flags = -DTP3_MODE=2
